{% extends 'base.html' %}
{% block title %}Create New User{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h3 class="fw-bold"><i class="bi bi-person-plus-fill"></i> Create New User</h3>
        <hr/>
    </div>
</div>

<div class="row justify-content-center mt-2">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <form method="POST" action="{{ url_for('create_user') }}" novalidate>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="user@example.com"
                                value="{{ form_data.email if form_data else '' }}"
                                required
                            />
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Min 8 characters"
                                required
                            />
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                <i class="bi bi-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                        <div class="form-text">Minimum 8 characters.</div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                            <input
                                type="password"
                                id="confirm_password"
                                name="confirm_password"
                                class="form-control"
                                placeholder="Re-enter password"
                                required
                            />
                        </div>
                    </div>

                    <!-- Agent Name -->
                    <div class="mb-3">
                        <label for="agent_name" class="form-label fw-semibold">Agent Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-building"></i></span>
                            <input
                                type="text"
                                id="agent_name"
                                name="agent_name"
                                class="form-control"
                                placeholder="Enter agent name"
                                value="{{ form_data.agent_name if form_data else '' }}"
                            />
                        </div>
                    </div>

                    <!-- Address -->
                    <div class="mb-3">
                        <label for="address" class="form-label fw-semibold">Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                            <textarea
                                id="address"
                                name="address"
                                class="form-control"
                                placeholder="Enter address"
                                rows="3"
                            >{{ form_data.address if form_data else '' }}</textarea>
                        </div>
                    </div>

                    <!-- Is Admin -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Admin Access</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="is_admin" id="admin_yes" value="Y">
                            <label class="form-check-label text-warning fw-semibold" for="admin_yes">
                                <i class="bi bi-shield-fill-check"></i> Yes — Admin
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="is_admin" id="admin_no" value="N" checked>
                            <label class="form-check-label text-secondary fw-semibold" for="admin_no">
                                <i class="bi bi-person"></i> No — Regular User
                            </label>
                        </div>
                    </div>

                    <!-- Is Active -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Status <span class="text-danger">*</span></label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="is_active" id="active" value="1" checked>
                            <label class="form-check-label text-success fw-semibold" for="active">
                                <i class="bi bi-check-circle-fill"></i> Active
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="is_active" id="inactive" value="0">
                            <label class="form-check-label text-danger fw-semibold" for="inactive">
                                <i class="bi bi-x-circle-fill"></i> Inactive
                            </label>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-person-check-fill"></i> Create User
                        </button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary px-4">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<script>
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function () {
        const pwd = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            pwd.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    });
</script>
{% endblock %}
